name: Deploy Cloud Resume DEV

on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: "AWS Access Key ID (da Learner Lab → AWS Details)"
        required: true
        type: string
      aws_secret_access_key:
        description: "AWS Secret Access Key (da Learner Lab → AWS Details)"
        required: true
        type: string
      aws_session_token:
        description: "AWS Session Token (da Learner Lab → AWS Details)"
        required: true
        type: string

jobs:
  deploy-dev:
    name: Deploy DEV (Learner Lab)
    runs-on: ubuntu-latest
    environment: dev

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "dev"
      TF_VAR_bucket_name: "cloud-resume-janice-brun-dev"
      TF_VAR_dynamodb_table_name: "cloud-resume-counter"
      TF_VAR_lambda_function_name: "cloud-resume-counter"
      TF_VAR_api_name: "cloud-resume-api"
      TF_VAR_cloudfront_price_class: "PriceClass_100"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Leggi output Terraform
        working-directory: terraform
        run: |
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> $GITHUB_ENV
          echo "CF_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
          echo "BUCKET_NAME=$(terraform output -raw bucket_name)" >> $GITHUB_ENV

      - name: Sostituisci placeholder in script.js
        run: sed -i "s|PLACEHOLDER_API_URL|${{ env.API_URL }}|g" frontend/script.js

      - name: Sync frontend su S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.DS_Store"

      - name: Invalida cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"
