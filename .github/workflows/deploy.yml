name: Deploy Cloud Resume

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente di deploy"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

jobs:
  # ── DEV — manuale, Learner Lab ───────────────────────────────────────────────
  deploy-dev:
    name: Deploy DEV (Learner Lab)
    runs-on: ubuntu-latest
    environment: dev
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_environment: "dev"
      TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
      TF_VAR_dynamodb_table_name: ${{ secrets.TF_VAR_DYNAMODB_TABLE_NAME }}
      TF_VAR_lambda_function_name: ${{ secrets.TF_VAR_LAMBDA_FUNCTION_NAME }}
      TF_VAR_api_name: ${{ secrets.TF_VAR_API_NAME }}
      TF_VAR_lab_role_arn: ${{ secrets.TF_VAR_LAB_ROLE_ARN }}
      TF_VAR_cloudfront_price_class: "PriceClass_100"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Leggi output Terraform
        working-directory: terraform
        run: |
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> $GITHUB_ENV
          echo "CF_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
          echo "BUCKET_NAME=$(terraform output -raw bucket_name)" >> $GITHUB_ENV

      - name: Sostituisci placeholder in script.js
        run: sed -i "s|PLACEHOLDER_API_URL|${{ env.API_URL }}|g" frontend/script.js

      - name: Sync frontend su S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.DS_Store"

      - name: Invalida cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"

  # ── PROD — automatico su push main, AWS reale ────────────────────────────────
  deploy-prod:
    name: Deploy PROD (AWS)
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
      TF_VAR_environment: "prod"
      TF_VAR_bucket_name: ${{ secrets.TF_VAR_BUCKET_NAME }}
      TF_VAR_dynamodb_table_name: ${{ secrets.TF_VAR_DYNAMODB_TABLE_NAME }}
      TF_VAR_lambda_function_name: ${{ secrets.TF_VAR_LAMBDA_FUNCTION_NAME }}
      TF_VAR_api_name: ${{ secrets.TF_VAR_API_NAME }}
      TF_VAR_lab_role_arn: ${{ secrets.TF_VAR_LAB_ROLE_ARN }}
      TF_VAR_cloudfront_price_class: "PriceClass_100"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (AWS reale)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Leggi output Terraform
        working-directory: terraform
        run: |
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> $GITHUB_ENV
          echo "CF_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
          echo "BUCKET_NAME=$(terraform output -raw bucket_name)" >> $GITHUB_ENV

      - name: Sostituisci placeholder in script.js
        run: sed -i "s|PLACEHOLDER_API_URL|${{ env.API_URL }}|g" frontend/script.js

      - name: Sync frontend su S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.DS_Store"

      - name: Invalida cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"
