name: Deploy Cloud Resume

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    name: Deploy PROD (AWS)
    runs-on: ubuntu-latest
    environment: prod

    env:
      TF_VAR_aws_region: "us-east-1"
      TF_VAR_environment: "prod"
      TF_VAR_bucket_name: "cloud-resume-janice-brun-prod"
      TF_VAR_dynamodb_table_name: "cloud-resume-counter"
      TF_VAR_lambda_function_name: "cloud-resume-counter"
      TF_VAR_api_name: "cloud-resume-api"
      TF_VAR_cloudfront_price_class: "PriceClass_100"
      TF_VAR_enable_cloudfront: "true"
      TF_VAR_use_oac: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (AWS reale)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config=backend-prod.hcl \
            -backend-config="bucket=cloud-resume-tfstate-prod-${ACCOUNT_ID}"

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Leggi output Terraform
        working-directory: terraform
        run: |
          echo "API_URL=$(terraform output -raw api_gateway_url)" >> $GITHUB_ENV
          echo "CF_DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV
          echo "BUCKET_NAME=$(terraform output -raw bucket_name)" >> $GITHUB_ENV

      - name: Sostituisci placeholder in script.js
        run: sed -i "s|PLACEHOLDER_API_URL|${{ env.API_URL }}|g" frontend/script.js

      - name: Sync frontend su S3
        run: |
          aws s3 sync frontend/ s3://${{ env.BUCKET_NAME }}/ \
            --delete \
            --cache-control "max-age=3600" \
            --exclude "*.DS_Store"

      - name: Invalida cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"
